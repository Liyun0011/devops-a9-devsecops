name: Lint (flake8 + bandit)

on:
  push:
  pull_request:

# Least privilege: this job only needs to read the code
permissions:
  contents: read

jobs:
  flake8:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to full commit SHAs (lesson from tj-actions, Mar 2025)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install linters
        run: pip install flake8 flake8-bandit

      - name: Run flake8 (a finding fails the build)
        run: flake8 src/ --count --statistics --show-source
