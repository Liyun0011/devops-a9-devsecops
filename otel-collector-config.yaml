# Task 2 config: receiver -> processor -> exporter
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317   # 0.0.0.0, not localhost, so the host can reach it
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

exporters:
  debug:
    verbosity: detailed
  file:
    path: /out/telemetry.json

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, file]
